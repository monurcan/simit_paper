# 50-sample validation split (hyperparameter tuning only). Same prompts, filters and
# metrics as gqa_lite; data built by rag_retrieval/build_val50_datasets.py.
include: gqa_lite.yaml
task: gqa_lite_val50
dataset_path: ${SIMIT_DATA}/val50/gqa_lite
dataset_name: null
dataset_kwargs:
  load_from_disk: True
test_split: val
# Validation rows embed their image; GQA testdev_balanced lookup (gqa_process_docs) does not apply.
process_docs: null
